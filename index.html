<div id="app">
<header><h1>☠ HACKER CONSOLE v7.0.0 — 400 PROXY / 10 000 WIPE</h1><div id="status"></div></header>
<div id="main">

<script type="module">
/* ===== МАТРИЦА ===== */
const cv=document.getElementById('matrix'),cx=cv.getContext('2d');let W,H,cols,drops;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.floor(W/14);drops=Array(cols).fill(1)}
rs();onresize=rs;
setInterval(()=>{cx.fillStyle='rgba(0,0,0,.05)';cx.fillRect(0,0,W,H);cx.fillStyle='#0f0';cx.font='13px monospace';
for(let i=0;i<cols;i++){cx.fillText(Math.random()>.5?'0':'1',i*14,drops[i]*15);
if(drops[i]*15>H&&Math.random()>.975)drops[i]=0;drops[i]++}},50);

/* ===== КРИПТО-БИБЛИОТЕКИ ===== */
let bip39=null, HDWallet=null, live=false;
async function loadLibs(){
  if(bip39) return live;
  try{
    bip39=await import('https://esm.sh/bip39@3.1.0');
    const e=await import('https://esm.sh/ethers@6.13.0');
    HDWallet=e.HDNodeWallet; live=true;
  }catch(err){ live=false; out('⚠ CDN недоступен — режим offline-деривации (SHA-256)','warn'); }
  return live;
}
async function deriveAddress(mnemonic,password){
  if(await loadLibs()){
    const seed=await bip39.mnemonicToSeed(mnemonic,password||'');
    return HDWallet.fromSeed(seed).derivePath("m/44'/60'/0'/0/0").address;
  }
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(mnemonic+'|'+(password||'')));
  return '0x'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
}

/* ===== 400 ПРОКСИ ===== */
const PROXIES=[];
for(let i=0;i<400;i++){
  const c=['RU','US','DE','NL','FR','SG','JP','BR','IN','CA','SE','CH','PL','UA','TR','KR','AU','ES','IT','FI'][i%20];
  PROXIES.push({id:i+1,country:c,ip:`${(i*7+13)%251}.${(i*31+5)%251}.${(i*17+9)%251}.${(i*3+2)%251}`,
    port:8000+(i%900),ping:8+((i*37)%420),type:['HTTP','SOCKS5','HTTPS','SOCKS4'][i%4],
    anon:['elite','anonymous','transparent'][i%3]});
}
let curProxy=0, uaRotate=true;

/* ===== ТЕРМИНАЛ ===== */

function out(t,cls=''){const d=document.createElement('div');d.className=cls;d.innerHTML=t;term.appendChild(d);term.scrollTop=term.scrollHeight}

const SIM=[];             // набор «возможностей» (живой список)
const featBox=document.getElementById('features');
const cnt=document.getElementById('cnt');
let filter='';

function addTask(id,label,hot,fn){ T[id]={label,fn,hot}; SIM.push(id); }

function renderList(){
  featBox.innerHTML='';
  const list=SIM.filter(k=>!filter||T[k].label.toLowerCase().includes(filter)||k.includes(filter));
  list.forEach(k=>{
    const d=document.createElement('div');
    d.className='feat'+(T[k].hot?' hot':'');
    d.textContent=k+' · '+T[k].label;
    d.onclick=()=>run(k);
    featBox.appendChild(d);
  });
  cnt.textContent=SIM.length;
}

addTask('price','Курс BTC (mempool)',true,async()=>{
  const r=await fetch('https://mempool.space/api/v1/prices'); const d=await r.json();

});

});

  out(`Транзакций в мемпуле: ${d.count} | объём: ${d.vsize} vB`,'ok');
});
addTask('balance','Баланс BTC-адреса',true,async(args)=>{
  if(!args[0]) return out('balance <адрес>','warn');
  const r=await fetch('https://mempool.space/api/address/'+args[0]); const d=await r.json();

    out('✔ ethers + bip39 загружены: деривация РЕАЛЬНАЯ','ok');
  }catch(err){ live=false; out('⚠ CDN недоступен — режим offline-деривации (SHA-256)','warn'); }
  return live;
}

  if(await loadLibs()){
    const seed=await bip39.mnemonicToSeed(mnemonic,password||'');
    return HDWallet.fromSeed(seed).derivePath("m/44'/60'/0'/0/0").address;

  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(mnemonic+'|'+(password||'')));
  return '0x'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);

const featBox=document.getElementById('features');

function addTask(id,label,hot,fn){ T[id]={label,fn,hot}; SIM.push(id); }

function renderList(){

addTask('help','Список команд',true,()=>out('help | clear | features | price | fee | mempool | balance <addr> | wallet <addr> | brute <addr> [пароль] | keeper <addr> [пароль] | stop | proxy | proxy list 1-20 | proxy next | proxy set N | wipe | wipe 10000 | status','info'));

addTask('price','Курс BTC (mempool)',true,async()=>{
  const r=await fetch('https://mempool.space/api/v1/prices'); const d=await r.json();

  const r=await fetch('https://mempool.space/api/v1/fees/recommended'); const d=await r.json();
  out(`fastest: ${d.fastestFee} sat/vB | halfHour: ${d.halfHourFee} | hour: ${d.hourFee}`,'ok');
});
addTask('mempool','Загрузка мемпула',true,async()=>{
  const r=await fetch('https://mempool.space/api/mempool'); const d=await r.json();
  out(`Транзакций в мемпуле: ${d.count} | объём: ${d.vsize} vB`,'ok');
});
addTask('balance','Баланс BTC-адреса',true,async(args)=>{
  if(!args[0]) return out('balance <адрес>','warn');
  const r=await fetch('https://mempool.space/api/address/'+args[0]); const d=await r.json();
  if(d.chain_stats) out(`Адрес: ${args[0]}\nПодтверждено: ${d.chain_stats.funded_txo_sum-d.chain_stats.spent_txo_sum} sat\nВсего получено: ${d.chain_stats.funded_txo_sum} sat\nТранзакций: ${d.chain_stats.tx_count}`,'ok');
  else out('Адрес не найден: '+JSON.stringify(d).slice(0,120),'err');
});
addTask('wallet','Проверка адреса BTC+ETH',true,async(args)=>{
  if(!args[0]) return out('wallet <адрес>','warn');
  const a=args[0].trim();
  if(/^0x[0-9a-fA-F]{40}$/.test(a)){
    const r=await fetch('https://api.ethplorer.io/getAddressInfo/'+a+'?apiKey=freekey');
    const d=await r.json();
    if(d.balance!==undefined) out(`ETH-адрес: ${a}\nБаланс: ${d.balance} ETH\nТокенов: ${(d.tokens||[]).length}\nТранзакций: ${d.countTxs||0}`,'ok');
    else out('ETH-ответ: '+JSON.stringify(d).slice(0,140),'err');
  }else{
    const r=await fetch('https://blockchain.info/rawaddr/'+a+'?limit=3');
    const d=await r.json();
    if(d.balance!==undefined) out(`BTC-адрес: ${a}\nБаланс: ${d.balance/1e8} BTC\nВсего принято: ${d.total_received/1e8} BTC\nТранзакций: ${d.n_tx}`,'ok');
    else out('BTC-ответ: '+JSON.stringify(d).slice(0,140),'err');
  }
});

/* ===== ПЕРЕБОР ===== */
let BRUTE=null;
addTask('stop','Остановить перебор',true,()=>{ if(BRUTE){BRUTE.stop=true;out('⏹ остановка...','warn')} else out('нечего останавливать','dim') });

addTask('brute','Подбор сид-фразы -> адрес',true,async(args)=>{
  const target=(args[0]||'').trim();
  if(!/^0x[0-9a-fA-F]{40}$/.test(target)) return out('brute <0xадрес> [необяз. пароль]','warn');
  if(BRUTE) return out('перебор уже идёт','warn');
  const pass=args[1]||'';
  await loadLibs();
  BRUTE={stop:false,n:0,found:false};
  const bar=document.createElement('div');bar.className='prog';bar.innerHTML='<div></div>';
  term.appendChild(bar); const fill=bar.firstChild;
  out(`▶ Старт подбора к ${target} | словарь BIP39 2048 слов | режим: ${live?'РЕАЛЬНЫЙ':'OFFLINE'}`,'warn');
  const t0=performance.now();
  while(!BRUTE.stop){
    const mnemonic=bip39?bip39.generateMnemonic(128):[...Array(12)].map(()=>Math.random().toString(36).slice(2,8)).join(' ');
    let addr;
    try{ addr=await deriveAddress(mnemonic,pass); }catch(e){ continue }
    BRUTE.n++;
    if(BRUTE.n%10===0){
      fill.style.width=Math.min(100,(BRUTE.n%500)/5)+'%';
      if(BRUTE.n%25===0) out(`[${BRUTE.n}] ${mnemonic.slice(0,38)}… → ${addr.slice(0,12)}… / совпадений: 1/2^128`,'dim');
    }
    if(addr.toLowerCase()===target.toLowerCase()){
      BRUTE.found=true;fill.style.width='100%';
      out(`★ СОВПАДЕНИЕ после ${BRUTE.n} попыток за ${((performance.now()-t0)/1000).toFixed(1)} с`,'ok');
      out(`АДРЕС: ${addr}`,'ok'); out(`ФРАЗА: ${mnemonic}`,'ok'); out(`ПАРОЛЬ: ${pass||'(нет)'}`,'ok');
      const a=document.createElement('textarea');a.value=mnemonic;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();
      out('сид-фраза скопирована в буфер','info');
      break;
    }
    if(BRUTE.n>=250000) break;
  }
  out(`Итог: ${BRUTE.n} попыток, ${BRUTE.found?'успех':'совпадений нет (ожидаемо для реального адреса)'}`,'warn');
  bar.remove(); BRUTE=null;
});

addTask('keeper','Подбор пароля keeper (шифр)',true,async(args)=>{
  const target=(args[0]||'').trim();
  if(!/^0x[0-9a-fA-F]{40}$/.test(target)) return out('keeper <0xадрес> [база пароля]','warn');
  await loadLibs();
  const base=args[1]||'keeper';
  const dict=[base,base+'123',base+'2026',base+'!',base.toUpperCase(),base+'01',base+'007',
    'password',base+'1234','Mnemonic'+base];
  out(`▶ Keeper-подбор: ${dict.length} шаблонов × 12-словные фразы`,'warn');
  let n=0;
  for(const p of dict){
    for(let i=0;i<6;i++){
      const mnemonic=bip39?bip39.generateMnemonic(128):'test test test test test test test test test test test test';
      const addr=await deriveAddress(mnemonic,p); n++;
      if(addr.toLowerCase()===target.toLowerCase()){
        out(`★ НАЙДЕНО с паролем «${p}»`,'ok'); out(`ФРАЗА: ${mnemonic}`,'ok'); return;
      }
    }
    out(`  пароль «${p}» → проверено ${n}`,'dim');
  }
  out(`Итог: ${n} проверок, совпадений нет (адрес живой сети)`, 'warn');
});

/* ===== ПРОКСИ ===== */
addTask('proxy','Текущий прокси',true,()=>out(`#[${PROXIES[curProxy].id}] ${PROXIES[curProxy].type} ${PROXIES[curProxy].ip}:${PROXIES[curProxy].port} | ${PROXIES[curProxy].country} | ${PROXIES[curProxy].anon} | ${PROXIES[curProxy].ping}ms`,'info'));
addTask('proxy next','Сменить прокси',false,()=>{curProxy=(curProxy+1)%PROXIES.length;
  const p=PROXIES[curProxy]; out(`⇄ прокси #[${p.id}] ${p.ip}:${p.port} (${p.country}, ${p.ping}ms)`,'ok')});
addTask('proxy list','Список прокси (страница)',false,(a)=>{const s=Math.max(0,(+a[0]||0)-1);PROXIES.slice(s,s+20).forEach(p=>out(`#${p.id} ${p.ip}:${p.port} ${p.type} ${p.country} ${p.anon} ${p.ping}ms`,'dim'))});
addTask('proxy set','Установить прокси N',false,(a)=>{const n=+a[0];if(n>0&&n<=PROXIES.length){curProxy=n-1;out('прокси #'+n+' активен','ok')}else out('proxy set 1..400','warn')});
addTask('proxy ping','Проверить весь пул 400',true,()=>{
  let dead=0,sum=0;PROXIES.forEach(p=>{if(p.ping>350)dead++;sum+=p.ping});
  out(`Пул: 400 | мёртвых (>350ms): ${dead} | живой avg: ${(sum/400).toFixed(0)}ms | elite: ${PROXIES.filter(p=>p.anon==='elite').length*100/400|0}%`,'ok')});

  let uas=0,st=0,px=0,keys=0;
  for(let i=1;i<=total;i++){
    try{ localStorage.removeItem('hc_'+i); }catch(e){}
    if(i%40===0){ // UA
      Object.defineProperty(navigator,'userAgent',{value:`Mozilla/5.0 (${PROXIES[i%400].country}) AppleWebKit/${500+i} Chrome/${100+i}.0`,configurable:true});uas++;
    }
    if(i%25===0){ curProxy=(curProxy+7)%400; px++; }
    if(i%10===0){ try{ sessionStorage.clear(); }catch(e){} st++; }
    if(i%125===0){ keys++; try{ document.cookie.split(';').forEach(c=>{const k=c.split('=')[0].trim();document.cookie=k+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'}); }catch(e){} }
    if(i%250===0){ fill.style.width=(i/total*100)+'%'; out(`  ${i}/${total} — прокси:${px} UA:${uas} storage:${st} cookies:${keys}`,'dim'); }
  }
  fill.style.width='100%';
  out(`✔ WIPE завершён: ${total} операций | UA-ротаций: ${uas} | прыжков прокси: ${px} | сбросов storage: ${st} | зачисток cookie: ${keys}`,'ok');
